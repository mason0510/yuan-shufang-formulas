<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中医袁淑芳 · 辨证参考助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="side-disclaimer left" aria-label="免责与风险"><div class="side-title">医者仁心</div><p>仅供辨证参考 · 须医师把关 · 不可自行抓药</p><div class="side-title risk">风险</div><p class="dose">计量错误可伤身；急危重症立刻就医</p></aside>

  <div class="app">
    <header>
      <div class="brand">
        <div class="avatar" aria-hidden="true">袁</div>
        <div>
          <h1>中医袁淑芳 · 辨证参考助手</h1>
          <p class="sub">医者仁心 · 墓碑验方参考 · 可自配模型供应商 · 非互联网处方</p>
        </div>
      </div>
      <button type="button" id="btnSettings" class="ghost">设置</button>
    </header>

    <div class="motto" aria-label="医者仁心">医者仁心 · 先问诊、慎开方、必提示风险</div>

    <div class="warn"><strong>医者仁心 / 风险：</strong>参考方须医师把关后抓药；不可自行照方；计量错误可伤身；急危重症请立刻就医。</div>

    <main id="chat" class="chat" aria-live="polite"></main>

    <div class="examples" aria-label="患者自述示例">
      <button type="button" class="example" data-fill="我32岁女，怕冷偏胖，痛经5年，量少色暗有血块；月经周期不准；药房无山甲，有皂刺、路路通、当归、川芎。">例：我32岁女，痛经怕冷…</button>
      <button type="button" class="example" data-fill="我28岁女，婚后3年未孕，形体偏胖，平时痰多、嗜睡，月经量少色淡；未服过西药促排；本地药房药味较全。">例：我28岁未孕偏胖…</button>
      <button type="button" class="example" data-fill="我45岁女，月经紊乱半年，潮热盗汗，心烦失眠；现服过更年片效果一般；请先问诊，信息不够先别开方。">例：我45岁更年期…</button>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="3" placeholder="例：我32岁女，怕冷偏胖，痛经5年，量少色暗有血块；药房无山甲、有皂刺路路通…（信息不全时请先补全再开参考方）" required></textarea>
      <div class="row">
        <button type="submit" id="send">开方</button>
        <button type="button" id="btnClear" class="ghost">清空对话</button>
      </div>
    </form>
  </div>


  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>模型供应商</h2>
      <p class="hint">可自配任意 OpenAI 兼容接口。演示预设走 CORS 代理 + 公开测试 Key；自定义 Key 只存本机浏览器，不会写入仓库。</p>
      <label>供应商预设
        <select id="preset">
          <option value="chainfuel">ChainFuel 演示（经 CORS 代理）</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <label>Base URL
        <input id="baseUrl" autocomplete="off" />
      </label>
      <label>上游真实地址（走代理时可选，写入请求头 X-Upstream-Base）
        <input id="upstreamBase" autocomplete="off" placeholder="留空则代理默认转发 ChainFuel" />
      </label>
      <label>Model
        <input id="model" autocomplete="off" />
      </label>
      <label>API 风格
        <select id="apiStyle">
          <option value="responses">responses（/v1/responses）</option>
          <option value="chat">chat（/v1/chat/completions）</option>
        </select>
      </label>
      <label>API Key
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
      </label>
      <div class="row">
        <button value="cancel" class="ghost">取消</button>
        <button id="saveSettings" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
