<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760">
  <rect width="520" height="760" rx="28" fill="#f4f4f4"/>
  <text x="36" y="48" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" fill="#8d8d8d">Claude Code</text>

  <rect x="36" y="84" width="200" height="52" rx="12" fill="#ffffff"/>
  <text x="136" y="116" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#333333">仓库里的文件</text>

  <rect x="284" y="84" width="200" height="52" rx="12" fill="#ffffff"/>
  <text x="384" y="116" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#333333">当前问题</text>

  <line x1="136" y1="136" x2="136" y2="172" stroke="#9a9a9a" stroke-width="1.6"/>
  <polygon points="130,172 142,172 136,182" fill="#9a9a9a"/>
  <line x1="384" y1="136" x2="384" y2="172" stroke="#9a9a9a" stroke-width="1.6"/>
  <polygon points="378,172 390,172 384,182" fill="#9a9a9a"/>

  <rect x="24" y="186" width="224" height="64" rx="12" fill="#ffffff"/>
  <text x="136" y="214" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#333333">Glob</text>
  <text x="136" y="236" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#333333">只看路径和文件名</text>

  <rect x="272" y="186" width="224" height="64" rx="12" fill="#ffffff"/>
  <text x="384" y="214" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#333333">Grep</text>
  <text x="384" y="236" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#333333">搜正文任意位置</text>

  <line x1="136" y1="250" x2="220" y2="318" stroke="#9a9a9a" stroke-width="1.6"/>
  <line x1="384" y1="250" x2="300" y2="318" stroke="#9a9a9a" stroke-width="1.6"/>
  <polygon points="214,312 228,324 222,308" fill="#9a9a9a"/>

  <rect x="110" y="328" width="300" height="58" rx="12" fill="#ffffff"/>
  <text x="260" y="362" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#333333">得到命中的文件和行</text>

  <line x1="260" y1="386" x2="260" y2="422" stroke="#9a9a9a" stroke-width="1.6"/>
  <polygon points="254,422 266,422 260,432" fill="#9a9a9a"/>

  <rect x="70" y="436" width="380" height="64" rx="12" fill="#ffffff"/>
  <text x="260" y="464" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#333333">Read 打开文件</text>
  <text x="260" y="486" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#333333">默认可从第 1 行，也能指定偏移</text>

  <line x1="260" y1="500" x2="260" y2="536" stroke="#9a9a9a" stroke-width="1.6"/>
  <polygon points="254,536 266,536 260,546" fill="#9a9a9a"/>

  <rect x="70" y="550" width="380" height="64" rx="12" fill="#ffffff"/>
  <text x="260" y="578" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#333333">看完再决定要不要继续搜</text>
  <text x="260" y="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#333333">模型只根据读到的片段回答</text>

  <text x="36" y="680" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="15" fill="#8d8d8d">没有向量库。不是只看文件名和开头几段。</text>
  <text x="36" y="708" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="15" fill="#8d8d8d">套餐 claudecode 用的就是这一列。不拿来选方。</text>
</svg>
