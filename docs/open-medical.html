<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>open-medical · 古方数据库</title>
  <link rel="icon" href="yuan-shufang.png" />
  <link rel="stylesheet" href="styles.css?v=142" />
</head>
<body>
  <div class="board-page">
    <header>
      <div>
        <h1>open-medical</h1>
        <p class="board-note">初心：把古方开源，留给后来的人。开源属于全人类。号召：一起做成世界最大的中医古方库，收录倪海厦等名医的方剂资料。正在收集，免费开放给每一个人。提交前请先注册。交来的内容单独入库，不自动写进墓碑验方。</p>
      </div>
      <a class="board-back" href="index.html">回开方</a>
    </header>

    <form id="gate" class="board-form" novalidate>
      <h2 id="gateTitle">请先注册</h2>
      <input id="gateName" maxlength="16" placeholder="怎么称呼" autocomplete="nickname" />
      <input id="gateEmail" type="email" maxlength="80" required placeholder="邮箱" autocomplete="username" />
      <input id="gatePassword" type="password" minlength="8" maxlength="72" required placeholder="密码至少 8 位" autocomplete="new-password" />
      <label>国籍
        <select id="gateCountry" required>
          <option value="">请选择</option>
          <option>中国</option><option>中国香港</option><option>中国澳门</option><option>中国台湾</option>
          <option>美国</option><option>加拿大</option><option>英国</option><option>日本</option><option>韩国</option>
          <option>新加坡</option><option>马来西亚</option><option>澳大利亚</option><option>德国</option><option>法国</option>
          <option>其他</option>
        </select>
      </label>
      <label>职业
        <select id="gateJob" required>
          <option value="">请选择</option>
          <option>中医师</option><option>中药师</option><option>西医师</option><option>医学生</option><option>药学</option>
          <option>古籍整理</option><option>文史研究</option><option>患者或家属</option><option>软件开发</option><option>其他</option>
        </select>
      </label>
      <fieldset>
        <legend>感兴趣的方向</legend>
        <div class="checks" id="gateInterests">
          <label><input type="checkbox" value="古方" />古方</label>
          <label><input type="checkbox" value="碑方" />碑方</label>
          <label><input type="checkbox" value="民间验方" />民间验方</label>
          <label><input type="checkbox" value="地方志" />地方志</label>
          <label><input type="checkbox" value="妇科" />妇科</label>
          <label><input type="checkbox" value="儿科" />儿科</label>
          <label><input type="checkbox" value="外科" />外科</label>
          <label><input type="checkbox" value="内科" />内科</label>
          <label><input type="checkbox" value="本草" />本草</label>
          <label><input type="checkbox" value="针灸" />针灸</label>
          <label><input type="checkbox" value="骨伤" />骨伤</label>
          <label><input type="checkbox" value="其他" />其他</label>
        </div>
      </fieldset>
      <label>通过什么方式找到这个网站
        <select id="gateFound" required>
          <option value="">请选择</option>
          <option>搜索引擎</option><option>GitHub</option><option>微信</option><option>朋友介绍</option>
          <option>新闻报道</option><option>小红书</option><option>微博</option><option>其他</option>
        </select>
      </label>
      <p id="gateStatus" class="board-status" role="status"></p>
      <div class="row">
        <button type="button" id="gateLogin" class="ghost">登录</button>
        <button type="submit" id="gateRegister">注册</button>
      </div>
    </form>
    <p class="board-note"><a href="https://github.com/mason0510/yuan-shufang-formulas/issues/" target="_blank" rel="noopener">反馈问题</a></p>
  </div>
  <script src="open-medical.js?v=5"></script>
</body>
</html>
